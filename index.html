<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Quick weight, height and BMI conversions." />
    <title>Converter</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Converter</h1>
    </header>
    <main class="cards" id="cards">
      <section class="card" id="weight-card" aria-labelledby="weight-title">
        <h2 id="weight-title">Weight</h2>
        <div class="pair">
          <div class="field">
            <label for="weight-kg">Kilograms</label>
            <div class="field-control">
              <input id="weight-kg" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" />
              <span class="unit" aria-hidden="true">kg</span>
            </div>
          </div>
          <span class="pair-separator" aria-hidden="true">⇄</span>
          <div class="field">
            <label for="weight-lb">Pounds</label>
            <div class="field-control">
              <input id="weight-lb" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" />
              <span class="unit" aria-hidden="true">lb</span>
            </div>
          </div>
        </div>
      </section>
      <section class="card" id="height-card" aria-labelledby="height-title">
        <h2 id="height-title">Height</h2>
        <div class="pair pair--stack-narrow">
          <div class="field">
            <label for="height-m">Metres</label>
            <div class="field-control">
              <input id="height-m" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" />
              <span class="unit" aria-hidden="true">m</span>
            </div>
          </div>
          <span class="pair-separator" aria-hidden="true">⇄</span>
          <div class="field-group">
            <div class="field">
              <label for="height-ft">Feet</label>
              <div class="field-control">
                <input id="height-ft" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" />
                <span class="unit" aria-hidden="true">ft</span>
              </div>
            </div>
            <div class="field">
              <label for="height-in">Inches</label>
              <div class="field-control">
                <input id="height-in" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" />
                <span class="unit" aria-hidden="true">in</span>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="card" id="bmi-card" aria-labelledby="bmi-title">
        <h2 id="bmi-title">BMI</h2>
        <p class="bmi-hint" data-bmi-hint>Enter a weight and a height above.</p>
        <dl class="bmi-result" data-bmi-result hidden>
          <div class="bmi-result-main">
            <dt id="bmi-value-label" class="visually-hidden">BMI</dt>
            <dd><output data-bmi-value aria-live="off" aria-labelledby="bmi-value-label"></output></dd>
          </div>
          <div>
            <dt id="bmi-who-label">WHO</dt>
            <dd><output data-bmi-who aria-live="off" aria-labelledby="bmi-who-label"></output></dd>
          </div>
          <div>
            <dt id="bmi-asian-label">Asian</dt>
            <dd><output data-bmi-asian aria-live="off" aria-labelledby="bmi-asian-label"></output></dd>
          </div>
        </dl>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
